[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag-financial"
version = "0.1.0"
description = "Vietnamese financial-report hybrid Graph RAG MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]
datasets = ["datasets>=3.2,<4", "huggingface-hub>=0.28,<1", "pandas>=2.2,<3"]
llm = ["openai>=1.60,<2"]

[project.scripts]
finrag = "financial_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

