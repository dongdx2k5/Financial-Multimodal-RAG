[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag"
version = "0.2.0"
description = "Financial Multimodal RAG with Structured SQLite facts, Hybrid BGE-M3 + FTS5 retrieval, and Qwen2.5-3B-Instruct"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
colab = [
    "torch>=2.2.0",
    "transformers>=4.42.0",
    "accelerate>=0.30.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "gradio>=4.40.0",
]

[project.scripts]
finrag = "financial_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
