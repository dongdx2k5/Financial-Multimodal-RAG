    <rect x="16" y="62" width="193" height="110" rx="10" fill="#581c87" fill-opacity="0.25" stroke="#9333ea" stroke-width="1" />
    <text x="26" y="85" font-size="12" font-weight="700" fill="#c084fc">🤖 LLM Summarizer</text>
    <text x="26" y="105" font-size="11" fill="#e2e8f0">• Tóm tắt ngữ nghĩa Bảng biểu</text>
    <text x="26" y="123" font-size="11" fill="#e2e8f0">• Phân tích ảnh biểu đồ (Vision)</text>
    <text x="26" y="141" font-size="11" fill="#94a3b8">• Tránh nhồi nhét bảng/ảnh lớn</text>
    <text x="26" y="158" font-size="10" fill="#c084fc">  vào Vector DB gây nhiễu</text>

    <!-- Sub-item 2: ChromaDB -->
    <rect x="16" y="190" width="193" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="214" font-size="12" font-weight="700" fill="#38bdf8">🔍 ChromaDB (Vectors)</text>
    <text x="26" y="235" font-size="11" fill="#94a3b8">• Lưu Vector Embedding của</text>
    <text x="26" y="250" font-size="11" fill="#f1f5f9">  bản tóm tắt ngữ nghĩa</text>
    <text x="26" y="270" font-size="11" fill="#94a3b8">• Tra cứu tương đồng Cosine</text>
    <text x="26" y="290" font-size="11" fill="#38bdf8">• Mapping qua <code>doc_id</code></text>

    <!-- Sub-item 3: DocStore -->
    <rect x="16" y="328" width="193" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="352" font-size="12" font-weight="700" fill="#a855f7">🗄️ DocStore (JSON KV)</text>
    <text x="26" y="373" font-size="11" fill="#94a3b8">• Lưu trữ 100% dữ liệu gốc:</text>
    <text x="32" y="393" font-size="11" fill="#e2e8f0">✓ Full text narratives</text>
    <text x="32" y="411" font-size="11" fill="#e2e8f0">✓ Raw HTML Table hoàn chỉnh</text>
    <text x="32" y="429" font-size="11" fill="#e2e8f0">✓ Ảnh đồ thị Base64 gốc</text>
    <text x="26" y="455" font-size="10" fill="#94a3b8">• Giữ nguyên cấu trúc cho LLM</text>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M 515 355 L 535 355" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" />

