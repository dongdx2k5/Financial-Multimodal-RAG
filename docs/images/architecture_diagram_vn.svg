<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#a855f7" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="840" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.4" />
  </pattern>
  <rect width="1280" height="840" fill="url(#grid)" />

  <!-- HEADER -->
  <g transform="translate(640, 45)" text-anchor="middle">
    <text font-size="28" font-weight="800" fill="url(#headerGrad)" letter-spacing="1">KIẾN TRÚC TỔNG THỂ HỆ THỐNG FINANCIAL MULTIMODAL RAG</text>
    <text y="25" font-size="14" font-weight="400" fill="#94a3b8">Hệ Thống RAG Đa Phương Thức Phân Tích Báo Cáo Tài Chính: Chuẩn Hóa FinQA • Multi-Vector • PoT Sandbox • Đa Mô Hình LLM</text>
  </g>

  <!-- ==================== TẦNG 1 ==================== -->
  <g transform="translate(40, 110)">
    <!-- Card Container -->
    <rect width="225" height="490" rx="16" fill="url(#blueCardGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Badge -->
    <rect x="12" y="14" width="201" height="34" rx="8" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" />
    <text x="112" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">TẦNG 1: TIỀN XỬ LÝ &amp; FINQA</text>

    <!-- Sub-item 1: PDF Input -->
    <rect x="16" y="62" width="193" height="65" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="84" font-size="12" font-weight="700" fill="#f8fafc">📄 Dữ Liệu Đầu Vào</text>
    <text x="26" y="102" font-size="11" fill="#94a3b8">• Báo cáo tài chính PDF</text>
    <text x="26" y="117" font-size="11" fill="#94a3b8">• Bộ FinQA, ViFinTab, EDGAR</text>

    <!-- Sub-item 2: Trích xuất Đa phương thức -->
    <rect x="16" y="138" width="193" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="158" font-size="12" font-weight="700" fill="#38bdf8">🔍 Bóc Tách Đa Phương Thức</text>
    <text x="26" y="176" font-size="11" fill="#94a3b8">• Text (pypdf)</text>
    <text x="26" y="193" font-size="11" fill="#94a3b8">• Bảng biểu (pdfplumber)</text>
    <text x="26" y="210" font-size="11" fill="#94a3b8">• Hình ảnh / Biểu đồ (Base64)</text>

    <!-- Sub-item 3: Chuẩn Hóa FinQA -->
    <rect x="16" y="234" width="193" height="240" rx="10" fill="#0369a1" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="26" y="258" font-size="12" font-weight="700" fill="#38bdf8">⚙️ Chuẩn Hóa FinQA Normalizer</text>
    
    <rect x="24" y="272" width="177" height="42" rx="6" fill="#0f172a" />
    <text x="32" y="290" font-size="11" font-weight="600" fill="#f1f5f9">Số âm kế toán:</text>
    <text x="32" y="306" font-size="11" fill="#38bdf8">(125.4)  ➔  -125.4</text>

    <rect x="24" y="322" width="177" height="42" rx="6" fill="#0f172a" />
    <text x="32" y="340" font-size="11" font-weight="600" fill="#f1f5f9">Nhận diện bậc số:</text>
    <text x="32" y="356" font-size="11" fill="#38bdf8">"in millions" ➔ ×1,000,000</text>

    <rect x="24" y="372" width="177" height="42" rx="6" fill="#0f172a" />
    <text x="32" y="390" font-size="11" font-weight="600" fill="#f1f5f9">Loại bỏ ký hiệu:</text>
    <text x="32" y="406" font-size="11" fill="#38bdf8">$1,200.50%  ➔  1200.50</text>

    <rect x="24" y="422" width="177" height="42" rx="6" fill="#0f172a" />
    <text x="32" y="440" font-size="11" font-weight="600" fill="#f1f5f9">Làm phẳng hàng (Flatten):</text>
    <text x="32" y="456" font-size="11" fill="#38bdf8">Op. Expenses &gt; Research</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 265 355 L 285 355" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

  <!-- ==================== TẦNG 2 ==================== -->
  <g transform="translate(290, 110)">
    <rect width="225" height="490" rx="16" fill="url(#blueCardGrad)" stroke="#7c3aed" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="14" width="201" height="34" rx="8" fill="#5b21b6" fill-opacity="0.35" stroke="#a855f7" stroke-width="1" />
    <text x="112" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">TẦNG 2: MULTI-VECTOR STORE</text>

