    <text x="26" y="408" font-size="12" font-weight="700" fill="#38bdf8">📋 Hybrid Fusion Prompt</text>
    <text x="26" y="428" font-size="10" fill="#94a3b8">• Ngữ cảnh Văn bản + Bảng HTML</text>
    <text x="26" y="444" font-size="10" fill="#94a3b8">• Hình ảnh biểu đồ Base64</text>
    <text x="26" y="460" font-size="10" fill="#34d399">• Mã Python + Đáp số đã tính</text>
  </g>

