    <text x="26" y="85" font-size="12" font-weight="700" fill="#f8fafc">🔀 Bộ Điều Hướng Câu Hỏi</text>
    <text x="26" y="105" font-size="11" fill="#4ade80">✓ Định lượng ➔ Chạy PoT</text>
    <text x="26" y="122" font-size="11" fill="#94a3b8">✗ Định tính ➔ Trả lời trực tiếp</text>

    <!-- Sub-item 2: Program of Thought Generator -->
    <rect x="16" y="150" width="193" height="110" rx="10" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <text x="26" y="174" font-size="12" font-weight="700" fill="#34d399">💻 Sinh Mã Python (PoT)</text>
    <text x="26" y="195" font-size="10" fill="#e2e8f0">• Trích xuất số liệu ngữ cảnh</text>
    <text x="26" y="210" font-size="10" fill="#e2e8f0">• Viết công thức toán bằng Python:</text>
    <text x="26" y="228" font-size="10" font-family="monospace" fill="#a7f3d0">  rev_20 = 1000.0</text>
    <text x="26" y="244" font-size="10" font-family="monospace" fill="#a7f3d0">  ans = (1200-1000)/1000*100</text>

    <!-- Sub-item 3: Safe Sandbox -->
