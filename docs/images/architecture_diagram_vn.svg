    <text x="26" y="296" font-size="12" font-weight="700" fill="#4ade80">🛡️ Safe Python Sandbox</text>
    <text x="26" y="316" font-size="11" fill="#94a3b8">• AST Safe Check (Chặn import)</text>
    <text x="26" y="333" font-size="11" fill="#94a3b8">• Timeout Protection (10s)</text>
    <text x="26" y="352" font-size="11" font-weight="700" fill="#22c55e">➔ Đáp số chính xác 100% (20.0%)</text>

    <!-- Sub-item 4: Hybrid Fusion Prompt -->
