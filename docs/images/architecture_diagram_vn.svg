    <text x="26" y="85" font-size="12" font-weight="700" fill="#fbbf24">❓ Câu Hỏi Người Dùng</text>
    <text x="26" y="105" font-size="11" fill="#fde68a">"Tỷ lệ tăng trưởng doanh thu</text>
    <text x="26" y="121" font-size="11" fill="#fde68a">2020 - 2021 là bao nhiêu %?"</text>

    <!-- Sub-item 2: Over-Retrieval -->
    <rect x="16" y="150" width="193" height="95" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="174" font-size="12" font-weight="700" fill="#f8fafc">🔎 Over-Retrieval (Top 2×K)</text>
