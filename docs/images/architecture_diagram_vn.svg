  <!-- ==================== FOOTER / BOTTOM SUMMARY BAR ==================== -->
  <g transform="translate(40, 625)">
    <rect width="1200" height="180" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="24" y="35" font-size="16" font-weight="700" fill="#f8fafc">💡 TÓM TẮT DÒNG CHẢY DỮ LIỆU ĐẶC BIỆT CỦA FINANCIAL MULTIMODAL RAG</text>

    <!-- 3 Highlight Columns -->
    <g transform="translate(24, 55)">
      <rect width="365" height="105" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <text x="16" y="28" font-size="13" font-weight="700" fill="#38bdf8">1. Tại sao dùng Multi-Vector?</text>
      <text x="16" y="50" font-size="11" fill="#cbd5e1">• Bảng tài chính &amp; ảnh biểu đồ rất lớn và phức tạp.</text>
      <text x="16" y="68" font-size="11" fill="#cbd5e1">• ChromaDB chỉ lưu tóm tắt ý nghĩa để tìm kiếm cực nhạy.</text>
      <text x="16" y="86" font-size="11" fill="#38bdf8">• DocStore giữ nguyên vẹn dữ liệu gốc nạp vào LLM.</text>
    </g>

    <g transform="translate(415, 55)">
      <rect width="365" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="16" y="28" font-size="13" font-weight="700" fill="#fbbf24">2. Re-Ranking có nhận thức thời gian</text>
      <text x="16" y="50" font-size="11" fill="#cbd5e1">• Báo cáo tài chính chứa số liệu của nhiều năm/quý.</text>
      <text x="16" y="68" font-size="11" fill="#cbd5e1">• Time-Anchor gắn trọng số cao cho đúng năm được hỏi.</text>
      <text x="16" y="86" font-size="11" fill="#fbbf24">• Triệt tiêu hoàn toàn việc lấy nhầm số liệu năm cũ.</text>
    </g>

    <g transform="translate(805, 55)">
      <rect width="370" height="105" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
      <text x="16" y="28" font-size="13" font-weight="700" fill="#4ade80">3. Loại bỏ ảo giác bằng PoT Sandbox</text>
      <text x="16" y="50" font-size="11" fill="#cbd5e1">• LLM rất hay tính nhẩm sai tỷ lệ tăng trưởng &amp; biên lãi.</text>
      <text x="16" y="68" font-size="11" fill="#cbd5e1">• PoT sinh mã Python thuần và chạy trong Sandbox an toàn.</text>
      <text x="16" y="86" font-size="11" fill="#4ade80">• Đảm bảo tính toán số liệu tài chính đúng tuyệt đối 100%.</text>
