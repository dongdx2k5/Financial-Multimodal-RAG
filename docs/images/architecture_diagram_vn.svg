    <text x="32" y="334" font-size="10" fill="#94a3b8">• Khớp chính xác năm: 2020, 2021</text>
    <text x="32" y="348" font-size="10" fill="#94a3b8">• Khớp quý / niên độ: Q3, FY20</text>

    <rect x="24" y="368" width="177" height="60" rx="6" fill="#0f172a" />
    <text x="32" y="388" font-size="11" font-weight="600" fill="#f59e0b">🏷️ Entity Matching:</text>
    <text x="32" y="404" font-size="10" fill="#94a3b8">• Khớp tên chỉ số tài chính</text>
    <text x="32" y="418" font-size="10" fill="#94a3b8">• Revenue, EBITDA, Net Income</text>

    <text x="26" y="454" font-size="11" font-weight="700" fill="#10b981">➔ Chọn ra Top-K bối cảnh chuẩn</text>
  </g>

  <!-- Connect 3 -> 4 -->
  <path d="M 765 355 L 785 355" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

